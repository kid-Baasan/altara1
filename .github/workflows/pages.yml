# Publishes the static design preview (./static-preview + ./public) to GitHub Pages on every push to main.
# Turn it on once: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy design preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble site (public files + exported pages)
        run: |
          mkdir _site
          cp -r public/. _site/
          cp -r static-preview/. _site/
          touch _site/.nojekyll

      - name: Fix paths for the project URL
        run: |
          REPO="${{ github.event.repository.name }}"
          case "$REPO" in
            *.github.io) BASE="" ;;
            *) BASE="/$REPO" ;;
          esac
          node scripts/rewrite-base.mjs _site "$BASE"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
